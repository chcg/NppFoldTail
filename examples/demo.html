<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <title>NppFoldTail HTML demo</title>
</head>
<body>
  <!-- Short multiline comment.
       All three lines appear in its tooltip.
  -->

  <!-- Long multiline comment.
       line 2
       line 3
       line 4
       line 5
       line 6
       line 7
       line 8
       line 9
       line 10
       line 11: omitted from tooltip
  -->

  <h3>
TITLE
  </h3><p> something </p>

  <div title="a > b">
    Attributes with quoted greater-than signs are supported.
  </div><p>preserved after the closing tag</p>

  <section>
    line 2
    line 3
    line 4
    line 5
    line 6
    line 7
    line 8
    line 9
    line 10
    line 11: omitted from tooltip
  </section>
</body>
</html>
